<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendeh - PDF Trend Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#ec4899', // Pink-500
            primaryHover: '#db2777', // Pink-600
            accent: '#8b5cf6', // Purple-500
            surface: '#ffffff',
            surfaceHighlight: '#f9fafb', // Gray-50
            textMain: '#111827', // Gray-900
            textMuted: '#6b7280', // Gray-500
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            'glow': '0 0 20px rgba(236, 72, 153, 0.3)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      /* The gradient background for the whole page */
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 50%, #c2e9fb 100%);
      background-attachment: fixed;
    }
    
    /* Custom Scrollbar for light theme */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d1d5db;
    }
    
    /* Custom Range Slider for light theme */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #ec4899;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(236, 72, 153, 0.4);
      border: 2px solid white;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #e5e7eb;
      border-radius: 3px;
    }
    input[type=range]:focus {
      outline: none;
    }
    input[type=range]:focus::-webkit-slider-runnable-track {
      background: #d1d5db;
    }

    /* Print Styles for PDF Export */
    @media print {
      @page {
        margin: 1.5cm;
        size: auto;
      }
      body {
        background: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      /* Hide scrollbars when printing */
      ::-webkit-scrollbar {
        display: none;
      }
    }
  </style>
  </head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
